name: Build and Deploy

on:
    push:
        branches:
            - master
    pull_request:

# What actions/deploy-pages needs: write access to Pages and a token it can
# prove itself with. Everything else stays read-only.
permissions:
    contents: read
    id-token: write
    pages: write

# A deploy that is already running is allowed to finish rather than being
# cancelled part way through publishing.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7

            - name: Install
              run: npm ci

            # The browser project runs the custom elements in real Chromium,
            # so the binary has to be fetched before vitest starts.
            - name: Install Chromium
              run: npx playwright install chromium --with-deps

            - name: Test
              run: npm run test-unit

            - name: Build
              run: npm run build

            - name: Upload artifact
              if: github.ref == 'refs/heads/master'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    # Pull requests get the tests and the build; only master ships.
    deploy:
        needs: build
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
